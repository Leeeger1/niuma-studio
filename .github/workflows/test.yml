name: 测试

# 每次推代码、开 PR 都跑一遍测试。命令行版写的是 Node 18+，所以 18 和 22 都跑。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 跑测试
        run: npm test
